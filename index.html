<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Data Fuuka</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="login" class="card login" hidden>
      <h1>Master Data Fuuka</h1>
      <p class="muted">Masukkan PIN untuk mengubah data bot.</p>
      <form id="login-form" autocomplete="off">
        <label for="pin">PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
        <button type="submit" class="primary" id="login-btn">Masuk</button>
      </form>
      <p id="login-msg" class="msg" role="status" aria-live="polite"></p>
    </section>

    <section id="editor" hidden>
      <header class="bar">
        <h1>Master Data Fuuka</h1>
        <button type="button" id="logout" class="ghost">Keluar</button>
      </header>
      <nav id="tabs" class="tabs" role="tablist" aria-label="Topik"></nav>
      <div class="grid">
        <div class="card">
          <div id="form"></div>
          <div class="actions">
            <button type="button" id="save" class="primary">Simpan</button>
            <span id="dirty" class="muted" hidden>Belum disimpan</span>
          </div>
          <p id="msg" class="msg" role="status" aria-live="polite"></p>
        </div>
        <aside class="card">
          <h2>Preview pesan WA</h2>
          <pre id="preview" class="preview"></pre>
        </aside>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="lib/buffText.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
